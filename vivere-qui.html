            <div class="flex items-center justify-between h-20">
                <div><a href="index.html"><img src="assets/logo-500-bn.png" alt="Baglio San Michele" class="h-11 w-auto"></a></div>
                <div class="hidden md:flex items-center gap-x-8 text-sm tracking-wider">
                    <a href="il-concept.html" class="hover:text-[#c8872f] transition-colors">Il Concept</a>
                    <a href="il-progetto.html" class="hover:text-[#c8872f] transition-colors">Il Progetto</a>

                </div>
                <button id="menu-btn" class="md:hidden flex items-center justify-center w-11 h-11 text-3xl text-[#c8872f]">☰</button>
            </div>
            <div id="mobile-menu" class="hidden md:hidden flex-col gap-y-3 pb-6 text-sm tracking-wider bg-white">
                <a href="il-concept.html" class="block py-2 hover:text-[#c8872f]">Il Concept</a>

    <!-- CONTENUTO COMPLETO DELLA PAGINA (con immagini atmosfera-famiglia.png, atmosfera-orto.png, atmosfera-coworking.png, atmosfera-casa.png, atmosfera-comunita.png, atmosfera-contadini.png, atmosfera-accoglienza.png, atmosfera-chiesa.png) -->

    <footer class="border-t border-gray-200 py-8 text-center text-sm text-[#666666]">© Baglio San Michele • Sicilian Slow Living</footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuBtn = document.getElementById('menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (menuBtn && mobileMenu) {
                menuBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    mobileMenu.classList.toggle('hidden');
                    mobileMenu.classList.toggle('flex');
                });
                document.addEventListener('click', function(e) {
                    if (!menuBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
                        if (!mobileMenu.classList.contains('hidden')) {
                            mobileMenu.classList.add('hidden');
                            mobileMenu.classList.remove('flex');
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
