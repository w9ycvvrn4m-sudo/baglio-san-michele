<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1120" height="900" fill="#faf7f1"/>

  <!-- ============ TITOLO ============ -->
  <text x="60" y="52" font-family="Georgia, serif" font-size="27" fill="#2f2a24">Riad Al-Uns &amp; Dar al-Diyafa — schema dei due corpi</text>
  <text x="60" y="76" font-size="14.5" fill="#7a7167">Pianta schematica, non in scala. Riad principale e foresteria (douiria): due edifici autonomi, un solo passaggio controllato.</text>
  <line x1="60" y1="92" x2="1060" y2="92" stroke="#d8cfc0" stroke-width="1"/>

  <!-- ============ DERB A (vicolo del riad) ============ -->
  <rect x="46" y="130" width="34" height="580" fill="#e8e1d4" stroke="#c9bfae" stroke-width="1"/>
  <text x="63" y="420" font-size="12.5" fill="#8a8073" text-anchor="middle" transform="rotate(-90 63 420)" letter-spacing="2">DERB A</text>

  <!-- ============ RIAD ============ -->
  <rect x="96" y="130" width="420" height="580" fill="#efe6d5" stroke="#3d3630" stroke-width="3.5"/>

  <!-- patio riad -->
  <rect x="212" y="292" width="190" height="260" fill="#fbf8f2" stroke="#b9ac95" stroke-width="1.5"/>
  <rect x="272" y="382" width="70" height="80" fill="#a9c0c4" stroke="#7f9aa0" stroke-width="1.2"/>
  <text x="307" y="368" font-size="12" fill="#6f665a" text-anchor="middle">patio</text>

  <!-- fasce interne riad -->
  <rect x="212" y="152" width="190" height="118" fill="#e4d8c1" stroke="#b9ac95" stroke-width="1"/>
  <text x="307" y="200" font-size="13" fill="#3d3630" text-anchor="middle">Camere</text>
  <text x="307" y="219" font-size="13" fill="#3d3630" text-anchor="middle">dei residenti</text>
  <text x="307" y="243" font-size="11.5" fill="#9c3a2e" text-anchor="middle">vietato agli ospiti</text>

  <rect x="212" y="574" width="190" height="114" fill="#e4d8c1" stroke="#b9ac95" stroke-width="1"/>
  <text x="307" y="620" font-size="13" fill="#3d3630" text-anchor="middle">Laboratori</text>
  <text x="307" y="639" font-size="13" fill="#3d3630" text-anchor="middle">Dar al-Hiraf</text>
  <text x="307" y="663" font-size="11.5" fill="#7a7167" text-anchor="middle">solo su decisione del M'Aallem</text>

  <rect x="118" y="292" width="76" height="260" fill="#e4d8c1" stroke="#b9ac95" stroke-width="1"/>
  <text x="156" y="410" font-size="12.5" fill="#3d3630" text-anchor="middle" transform="rotate(-90 156 410)">Sqifa d'ingresso</text>

  <rect x="420" y="292" width="76" height="260" fill="#ded0b4" stroke="#b9ac95" stroke-width="1"/>
  <text x="458" y="416" font-size="12.5" fill="#3d3630" text-anchor="middle" transform="rotate(-90 458 416)">Majlis — sala comune</text>

  <!-- porta riad su derb A -->
  <rect x="90" y="398" width="12" height="48" fill="#9c3a2e"/>
  <text x="128" y="480" font-size="11.5" fill="#7a7167">porta del riad</text>

  <text x="306" y="712" font-family="Georgia, serif" font-size="17" fill="#2f2a24" text-anchor="middle">RIAD AL-UNS</text>
  <text x="306" y="732" font-size="12.5" fill="#7a7167" text-anchor="middle">Fondazione — non commerciale</text>

  <!-- ============ PASSAGGIO A GOMITO ============ -->
  <path d="M 516 372 L 560 372 L 560 470 L 604 470" fill="none" stroke="#3d3630" stroke-width="3.5"/>
  <path d="M 516 428 L 604 428 L 604 470" fill="none" stroke="#3d3630" stroke-width="3.5" opacity="0"/>
  <rect x="530" y="352" width="60" height="136" fill="#f4ece0" stroke="#3d3630" stroke-width="1.2" opacity="0.45"/>

  <!-- porta controllata -->
  <rect x="510" y="360" width="13" height="26" fill="#9c3a2e"/>
  <circle cx="516" cy="336" r="10" fill="#9c3a2e"/>
  <text x="516" y="340" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>

  <text x="560" y="530" font-size="11.5" fill="#7a7167" text-anchor="middle">soglia</text>
  <text x="560" y="546" font-size="11.5" fill="#7a7167" text-anchor="middle">a gomito</text>

  <!-- ============ DOUIRIA ============ -->
  <rect x="604" y="130" width="420" height="580" fill="#e6e9e5" stroke="#3d3630" stroke-width="3.5"/>

  <rect x="720" y="292" width="180" height="260" fill="#f7f9f6" stroke="#a8b2a5" stroke-width="1.5"/>
  <rect x="776" y="382" width="68" height="80" fill="#a9c0c4" stroke="#7f9aa0" stroke-width="1.2"/>
  <text x="810" y="368" font-size="12" fill="#6f665a" text-anchor="middle">patio</text>

  <rect x="640" y="152" width="126" height="118" fill="#d7ddd4" stroke="#a8b2a5" stroke-width="1"/>
  <text x="703" y="217" font-size="13" fill="#3d3630" text-anchor="middle">Suite 1</text>
  <rect x="782" y="152" width="126" height="118" fill="#d7ddd4" stroke="#a8b2a5" stroke-width="1"/>
  <text x="845" y="217" font-size="13" fill="#3d3630" text-anchor="middle">Suite 2</text>
  <rect x="640" y="574" width="126" height="114" fill="#d7ddd4" stroke="#a8b2a5" stroke-width="1"/>
  <text x="703" y="637" font-size="13" fill="#3d3630" text-anchor="middle">Suite 3</text>
  <rect x="782" y="574" width="126" height="114" fill="#d7ddd4" stroke="#a8b2a5" stroke-width="1"/>
  <text x="845" y="637" font-size="13" fill="#3d3630" text-anchor="middle">Suite 4</text>

  <rect x="640" y="292" width="66" height="260" fill="#d7ddd4" stroke="#a8b2a5" stroke-width="1"/>
  <text x="673" y="422" font-size="12" fill="#3d3630" text-anchor="middle" transform="rotate(-90 673 422)">Vestibolo</text>

  <rect x="918" y="292" width="90" height="260" fill="#ccd4c9" stroke="#a8b2a5" stroke-width="1"/>
  <text x="963" y="422" font-size="12" fill="#3d3630" text-anchor="middle" transform="rotate(-90 963 422)">Cucina · servizio · deposito</text>

  <!-- porte douiria su derb B -->
  <rect x="1018" y="316" width="12" height="44" fill="#9c3a2e"/>
  <circle cx="1050" cy="300" r="10" fill="#9c3a2e"/>
  <text x="1050" y="304" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <rect x="1018" y="484" width="12" height="44" fill="#4f6b55"/>
  <circle cx="1050" cy="546" r="10" fill="#4f6b55"/>
  <text x="1050" y="550" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>

  <text x="814" y="712" font-family="Georgia, serif" font-size="17" fill="#2f2a24" text-anchor="middle">DAR AL-DIYAFA</text>
  <text x="814" y="732" font-size="12.5" fill="#7a7167" text-anchor="middle">Veicolo immobiliare — quattro chiavi</text>

  <!-- ============ DERB B ============ -->
  <rect x="1040" y="130" width="34" height="580" fill="#e8e1d4" stroke="#c9bfae" stroke-width="1"/>
  <text x="1057" y="420" font-size="12.5" fill="#8a8073" text-anchor="middle" transform="rotate(-90 1057 420)" letter-spacing="2">DERB B</text>

  <!-- ============ NOTE NUMERATE ============ -->
  <line x1="60" y1="762" x2="1060" y2="762" stroke="#d8cfc0" stroke-width="1"/>

  <circle cx="72" cy="790" r="9" fill="#9c3a2e"/>
  <text x="72" y="794" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="90" y="787" font-size="13" fill="#2f2a24">Passaggio unico, normalmente chiuso.</text>
  <text x="90" y="806" font-size="12.5" fill="#7a7167">Il comando dell'apertura sta dal lato del riad. La soglia svolta: dalla foresteria non si vede il patio.</text>

  <circle cx="72" cy="838" r="9" fill="#9c3a2e"/>
  <text x="72" y="842" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="90" y="835" font-size="13" fill="#2f2a24">Ingresso degli ospiti su un derb diverso.</text>
  <text x="90" y="854" font-size="12.5" fill="#7a7167">Nessun ospite attraversa mai la porta del riad.</text>

  <circle cx="612" cy="790" r="9" fill="#4f6b55"/>
  <text x="612" y="794" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="630" y="787" font-size="13" fill="#2f2a24">Servizio, cucina e logistica interamente nella foresteria.</text>
  <text x="630" y="806" font-size="12.5" fill="#7a7167">Nessun flusso di servizio attraversa il riad. Nessun residente serve un ospite.</text>

  <rect x="612" y="826" width="18" height="18" fill="none" stroke="#9c3a2e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="646" y="835" font-size="13" fill="#2f2a24">Terrazze — nessuna veduta dominante sul nucleo di lavoro.</text>
  <text x="646" y="854" font-size="12.5" fill="#7a7167">Quota o schermatura sul solo tratto che guarda patio, laboratori e terrazza dei residenti. Il resto è libero.</text>

  <!-- regola di fondo -->
  <rect x="60" y="112" width="1000" height="0.5" fill="none"/>
</svg>
