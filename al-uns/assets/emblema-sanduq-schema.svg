<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Embleme d As-Sanduq : trois cles nouees">
<title>As-Sanduq — trois clés nouées</title>
<desc>Emblème de la caisse de la futuwwa du Riad Al-Uns : trois clés disposées à 120 degrés, leurs anneaux entrelacés, dans un double cercle scandé de douze points. Trois pour les trois serrures du coffre, douze pour la mesure du cercle.</desc>

<g fill="none" stroke="#c8872f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

  <!-- cadre : double cercle -->
  <circle cx="200" cy="200" r="170" stroke-width="3.5"/>
  <circle cx="200" cy="200" r="152" stroke-width="2"/>

  <!-- douze points dans la bande -->
  <g fill="#c8872f" stroke="none">
    <circle cx="361.0" cy="200.0" r="4"/>
    <circle cx="339.4" cy="280.5" r="4"/>
    <circle cx="280.5" cy="339.4" r="4"/>
    <circle cx="200.0" cy="361.0" r="4"/>
    <circle cx="119.5" cy="339.4" r="4"/>
    <circle cx="60.6"  cy="280.5" r="4"/>
    <circle cx="39.0"  cy="200.0" r="4"/>
    <circle cx="60.6"  cy="119.5" r="4"/>
    <circle cx="119.5" cy="60.6"  r="4"/>
    <circle cx="200.0" cy="39.0"  r="4"/>
    <circle cx="280.5" cy="60.6"  r="4"/>
    <circle cx="339.4" cy="119.5" r="4"/>
  </g>

  <!-- les trois anneaux, noués au centre -->
  <circle cx="200.0" cy="174.0" r="30" stroke-width="3.5"/>
  <circle cx="222.5" cy="213.0" r="30" stroke-width="3.5"/>
  <circle cx="177.5" cy="213.0" r="30" stroke-width="3.5"/>

  <!-- clé I — vers le haut -->
  <path d="M200 144 L200 88"/>
  <path d="M200 130 L213 130"/>
  <path d="M200 120 L210 120"/>

  <!-- clé II — vers le bas à droite -->
  <path d="M248.5 228 L297 256"/>
  <path d="M260.6 235 L254.1 246.3"/>
  <path d="M269.3 240 L264.3 248.7"/>

  <!-- clé III — vers le bas à gauche -->
  <path d="M151.5 228 L103 256"/>
  <path d="M139.4 235 L132.9 223.7"/>
  <path d="M130.7 240 L125.7 231.3"/>

</g>
</svg>
