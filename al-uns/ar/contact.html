<main class="pt-28 pb-20">
<div class="max-w-3xl mx-auto px-6">
<div class="text-center mb-12">
<div class="inline-block px-4 py-1 rounded-full bg-[#c8872f]/10 text-[#c8872f] text-xs kicker mb-6">العتبة</div>
<h1 class="heading text-5xl mb-6">مراسلة</h1>
<p class="text-secondary text-lg leading-relaxed">لإقامة قصيرة، أو تدريب، أو طلب سكنى، أو سند، أو تعاون: اكتبوا إلينا.</p>
</div>
<div class="rounded-3xl overflow-hidden mb-12 bg-gray-100 aspect-[16/9]">
<img src="/assets/contact-1.jpg" alt="مراسلة رياض الأنس" class="w-full h-full object-cover">
</div>
<form action="https://formsubmit.co/info@al-uns.com" method="POST" class="space-y-6">
<input type="hidden" name="_subject" value="رياض الأنس — رسالة جديدة">
<input type="hidden" name="_captcha" value="false">
<input type="text" name="_honey" style="display:none">
<div>
<label for="name" class="block text-sm text-secondary mb-2">الاسم</label>
<input type="text" id="name" name="name" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#c8872f]" placeholder="اسمك">
</div>
<div>
<label for="email" class="block text-sm text-secondary mb-2">البريد</label>
<input type="email" id="email" name="email" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#c8872f]" placeholder="you@example.com" dir="ltr">
</div>
<div>
<label for="motif" class="block text-sm text-secondary mb-2">المقصد</label>
<select id="motif" name="motif" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#c8872f] bg-white">
<option value="" disabled selected>اختر مقصداً</option>
<option value="استعلام عام">استعلام عام</option>
<option value="إقامة قصيرة">إقامة قصيرة</option>
<option value="تدريب على حرفة">تدريب على حرفة</option>
<option value="طلب سكنى">طلب سكنى</option>
<option value="سند ومروءة">سند ومروءة</option>
<option value="تعاون">تعاون</option>
<option value="غير ذلك">غير ذلك</option>
</select>
</div>
<div>
<label for="message" class="block text-sm text-secondary mb-2">الرسالة</label>
<textarea id="message" name="message" rows="6" required class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#c8872f]" placeholder="رسالتك…"></textarea>
</div>
<button type="submit" class="w-full md:w-auto border border-[#c8872f] text-[#c8872f] px-10 py-3.5 rounded-full text-sm hover:bg-[#c8872f] hover:text-white transition">أرسل</button>
</form>
<p class="text-secondary text-sm text-center mt-10">نجيب في أقرب وقت مستطاع.</p>
<p class="text-secondary text-sm text-center mt-4">أو اكتبوا مباشرة إلى <a href="mailto:info@al-uns.com" class="text-[#c8872f] hover:underline">info@al-uns.com</a></p>
</div>
</main>
